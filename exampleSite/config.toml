baseURL               = "https://nbdh.top/"
languageCode          = "zh-CN"
title                 = "牛逼导航"
theme                 = "WebStack-Hugo"
preserveTaxonomyNames = true
disablePathToLower    = true
hasCJKLanguage        = true
publishDir            = "public"				# 站点静态文件保存目录


[params]
    author        = "NB"
    description   = "牛逼导航 | 常用网站与效率工具，一站直达"
    repository    = "https://github.com/shenweiyan/WebStack-Hugo"  
    enablePreLoad = true					# 网站完全打开前预加载动画
    textPreLoad   = "NB导航网站"				# 预加载的动画文字, 只有当enablePreLoad=true时生效
    expandSidebar = false					# 默认展开左侧边导航栏
    logosPath     = "assets/images/logos"			# 网站每个导航地址logo存放地址
    defaultLogo   = "assets/images/logos/default.webp"		# logo图片资源不存在或者错误时, 默认显示的logo; 该参数如为空,将会一直加载对应的logo,直至成功
    nightMode     = false					# 默认站点为深色(夜间)模式
    yiyan         = true                         		# 默认启用一言服务
    fancybox      = true                                        # 使用 Fancybox 实现图片灯箱/放大功能

[params.seo]    
    baiduhmid       = 'efccc04cb44fc49faddac5876180b369'	# 百度统计 hm.src 的 ID
    baiduSiteVer    = 'codeva-cCAOSG8MBO'			# 百度HTML标签验证(baidu-site-verification)
    tj51laid        = ''                        		# 51.LA 网站统计
    tj51lack        = ''
    GoogleAdsClient = ''					# Google AdSense 

[params.qweather]
    key = ""

[params.images]
    favicon           = "assets/images/nb-logo.svg"
    searchImageL      = "assets/images/bg-dna.jpg"		# 搜索部分浅色背景图
    searchImageD      = "assets/images/bg-dna.jpg"		# 搜索部分深色背景图
    logoExpandLight   = "assets/images/nb-logo.svg"
    logoExpandDark    = "assets/images/nb-logo.svg"
    logoCollapseLight = "assets/images/nb-logo.svg"
    logoCollapseDark  = "assets/images/nb-logo.svg"
    
[markup.goldmark.renderer]
    unsafe = true

[params.footer]
    copyright = '&copy; {year} 牛逼导航 · 常用网站与效率工具，一站直达<br/>基于 [WebStack-Hugo](https://github.com/shenweiyan/WebStack-Hugo) 构建'
